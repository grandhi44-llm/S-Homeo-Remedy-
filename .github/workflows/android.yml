name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licences (SDK is pre-installed on the runner)
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Restore the fixed signing key (repository secrets SHC_KEYSTORE_B64 / SHC_KEYSTORE_PASS)
        if: ${{ env.KS != '' }}
        env:
          KS: ${{ secrets.SHC_KEYSTORE_B64 }}
        run: echo "$KS" | base64 -d > android/app/shc-upload.jks

      - name: Build APK (signed with the fixed key when the secrets exist, otherwise debug-signed)
        working-directory: android
        env:
          SHC_KEYSTORE_PASS: ${{ secrets.SHC_KEYSTORE_PASS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk SHC-Remedy-Finder-debug.apk

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SHC-Remedy-Finder-debug-apk
          path: SHC-Remedy-Finder-debug.apk

      - name: Publish APK as a release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: SHC Remedy Finder build ${{ github.run_number }}
          body: Debug APK built automatically from commit ${{ github.sha }}. Download the .apk below and open it on the phone.
          files: SHC-Remedy-Finder-debug.apk
